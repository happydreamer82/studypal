<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>SeitenFrager</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header>
    <h1>SeitenFrager</h1>
    <p id="quelle" class="quelle" hidden></p>
  </header>

  <form id="frage-formular">
    <label class="visuell-versteckt" for="frage">Frage zur aktuellen Seite</label>
    <textarea id="frage" rows="3"
      placeholder="Frage zur aktuellen Seite, z. B. 'Was kostet das Angebot?'"
      required></textarea>
    <button id="senden" type="submit">Fragen</button>
  </form>

  <section id="antwort-bereich" aria-live="polite">
    <p id="status" class="status" hidden></p>
    <div id="antwort" class="antwort"></div>
  </section>

  <details id="einstellungen">
    <summary>Einstellungen</summary>
    <form id="einstellungen-formular">
      <label>API-Key
        <input type="password" id="api-key" autocomplete="off"
          placeholder="Key aus ~/agenthub/config/agent-keys.env">
      </label>
      <label>Modell
        <input type="text" id="modell" placeholder="agent">
      </label>
      <label>Modell-Adresse
        <input type="text" id="basis-url" placeholder="http://127.0.0.1:4000/v1">
      </label>
      <button type="submit">Speichern</button>
      <p id="einstellungen-status" class="status" hidden></p>
    </form>
  </details>

  <script src="panel.js"></script>
</body>
</html>
